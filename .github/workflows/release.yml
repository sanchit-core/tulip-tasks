name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: macos (aarch64)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macos (x86_64)
            os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget \
            xdg-utils

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Bypass the npm "tauri" script: it sources a Nix-only env file that
          # does not exist on GitHub runners. Uses the local @tauri-apps/cli.
          tauriScript: npx tauri
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Tulip Kanban ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            ## Tulip Kanban ${{ github.event.inputs.tag || github.ref_name }}

            Neo-brutalist kanban board with calendar, backlog inbox and recurring tasks.

            | Platform | Installers |
            | --- | --- |
            | Linux x86_64 | `.deb`, `.rpm` |
            | Windows x86_64 | `.msi`, `-setup.exe` (NSIS) |
            | macOS (Apple Silicon) | `.dmg` |
            | macOS (Intel) | `.dmg` |

            These artifacts are unsigned, so your OS will show a security warning on first launch.
          generateReleaseNotes: true
          prerelease: false
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }}
          releaseAssetNamePattern: >-
            ${{ matrix.target }}_[name]_[version]_[ext]
